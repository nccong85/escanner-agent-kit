name: Bug report
description: An agent, command, hook or validator did something wrong
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Component
      description: Plugin and file, e.g. review-gate/bin/validate_rule_ids.sh
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Commands or prompt, and the exact output. Remove anything private.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Claude Code version
      placeholder: claude --version
    validations:
      required: true
